<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  pre { position: fixed; inset: 0 auto auto 0; margin: 0; padding: 1em; max-width: 100%; box-sizing: border-box; color: #fc8; font: 14px monospace; white-space: pre-wrap; }
</style>
<canvas id="c"></canvas>
<pre id="msg"></pre>
<script type="module">
  // Dev aid for the 3D gallery scene (TODO 13.3): the auto plan for N children
  // (?n=40), a camera that tours the rooms. Not part of the app.
  import { autoPlan } from '/app/gallery/autoplan.js';
  import { buildGallery } from '/app/gallery/build.js';
  import { hang } from '/app/gallery/hang.js';
  import { enterScene } from '/app/gallery/scene.js';

  const say = text => (document.getElementById('msg').textContent = text);
  const webgl = (() => {
    try {
      const c = document.createElement('canvas');

      return !!(c.getContext('webgl2') || c.getContext('webgl'));
    } catch(e) {
      return false;
    }
  })();

  if(!webgl) say('This browser cannot create a WebGL context.\nCheck that hardware acceleration is on (chrome://gpu, about:support) and that WebGL is not blocked.');

  const n = +new URLSearchParams(location.search).get('n') || 40;
  const plan = autoPlan(n);
  const built = buildGallery(plan);
  const { hung } = hang(plan, Array.from({ length: n }, (_, i) => ({ id: 'vitrine ' + i })));
  const g = !webgl ? null : await enterScene(document.getElementById('c'), built, hung, {
    onFrame(time, dt, camera) {
      const span = (plan.plan.floors.length - 1) * 18 + 6;
      const x = 6 + ((time / 1000) * 2) % span;

      camera.position.x = x;
      camera.rotation.y = -Math.PI / 2 + Math.sin(time / 1500) * 0.5;
    },
  }).catch(e => say(String(e?.stack ?? e)));

  window.gallery = g;
</script>
